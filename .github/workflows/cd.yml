name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/insights-node-backend
            docker pull ${{ secrets.DOCKER_USERNAME }}/insights-backend-dotnet
            docker pull ${{ secrets.DOCKER_USERNAME }}/insights-frontend

            docker stop insights-node-backend || true && docker rm insights-node-backend || true
            docker stop insights-backend-dotnet || true && docker rm insights-backend-dotnet || true
            docker stop insights-frontend || true && docker rm insights-frontend || true

            docker run -d --name insights-node-backend -p 4000:4000 ${{ secrets.DOCKER_USERNAME }}/insights-node-backend
            docker run -d --name insights-backend-dotnet -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/insights-backend-dotnet
            docker run -d --name insights-frontend -p 80:80 ${{ secrets.DOCKER_USERNAME }}/insights-frontend
